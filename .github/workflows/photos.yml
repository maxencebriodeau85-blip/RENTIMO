name: Photos

on:
  push:
    branches: [sources-photos]
    paths: [scripts/photos.json, scripts/telecharger-photos.mjs, .github/workflows/photos.yml]

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/telecharger-photos.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/photos
          git commit -m "Photos sources téléchargées depuis Unsplash" || echo "Rien à committer"
          git push
